<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C288" />
      <stop offset="35%" stop-color="#E2A65F" />
      <stop offset="70%" stop-color="#CB8D44" />
      <stop offset="100%" stop-color="#A56D2C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E10" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#05080A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Subtle Studio Teal Inner Frame -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#183036" stroke-width="4" opacity="0.8" />

  <!-- 35mm Optical Viewfinder Corner Brackets -->
  <path d="M 68 136 L 68 68 L 136 68" fill="none" stroke="#CB8D44" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 376 68 L 444 68 L 444 136" fill="none" stroke="#CB8D44" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68 376 L 68 444 L 136 444" fill="none" stroke="#CB8D44" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 376 444 L 444 444 L 444 376" fill="none" stroke="#CB8D44" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Studio Live REC Telemetry Dot -->
  <circle cx="392" cy="118" r="14" fill="#FF4D4D" />
  <circle cx="392" cy="118" r="20" fill="none" stroke="#FF4D4D" stroke-width="2" opacity="0.4" />

  <!-- Center Monogram "B" (Boitumelo B Productions) -->
  <g fill="url(#goldGrad)">
    <!-- Main Serif Stem -->
    <path d="M 164 128 L 284 128 C 334 128 368 150 368 190 C 368 220 348 242 320 252 C 356 262 380 288 380 328 C 380 376 338 404 280 404 L 164 404 L 164 366 L 194 366 L 194 166 L 164 166 Z M 238 166 L 238 238 L 278 238 C 304 238 322 224 322 202 C 322 180 304 166 278 166 Z M 238 274 L 238 366 L 282 366 C 312 366 332 350 332 320 C 332 290 310 274 282 274 Z" />
  </g>

  <!-- Horizontal Reticle Lines -->
  <line x1="44" y1="256" x2="72" y2="256" stroke="#CB8D44" stroke-width="2" opacity="0.6" />
  <line x1="440" y1="256" x2="468" y2="256" stroke="#CB8D44" stroke-width="2" opacity="0.6" />
</svg>
